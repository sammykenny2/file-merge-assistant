# Preview release of the Windows setup program. Manual only. Before running:
#   - verify CI and the native notice policy documented in docs/deployment.md;
#   - keep the update repository public,
#     because the in-app update check reads the public release feed and cannot see a private repository.
#
# Builds the version in Directory.Build.props from the selected commit on main and publishes one GitHub prerelease
# tagged v<version> with the setup/portable binaries, native rebuild source, checksums and the update manifest the
# in-app update check reads. An existing tag or release is never replaced: bump the version to publish again. The
# release text and the update summary come from that version's entry in docs/release-notes.md. The release is created
# only after the build succeeds, so a failed run publishes nothing.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build the setup program
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      ci_url: ${{ steps.ci.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Require successful CI for this commit
        id: ci
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yaml --commit $env:GITHUB_SHA --event push --status completed --limit 20 --json conclusion,headSha,url
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect CI results.' }
          $successful = @($runs | ConvertFrom-Json | Where-Object { $_.headSha -eq $env:GITHUB_SHA -and $_.conclusion -eq 'success' })
          if ($successful.Count -eq 0) {
            throw 'This exact commit needs successful push CI before release.'
          }
          "url=$($successful[0].url)" >> $env:GITHUB_OUTPUT
      - name: Prepare the pinned native toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) { throw 'The Windows build host needs rustup and MSVC C++/Windows SDK build tools.' }
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain installation failed.' }
      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Releases are built from main.' }
          $version = (dotnet msbuild src/Gui/Gui.csproj -nologo -getProperty:Version).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Invalid version '$version'." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Refuse a version that was already published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          # Both queries must succeed: an error is not taken to mean that the tag is free.
          $refs = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the existing tags.' }
          if (@($refs | ConvertFrom-Json | Where-Object ref -eq "refs/tags/$env:TAG").Count -gt 0) {
            throw "$env:TAG already exists. Bump <Version> in Directory.Build.props to publish again."
          }
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the existing releases.' }
          if (@($releases | ConvertFrom-Json | Where-Object tagName -eq $env:TAG).Count -gt 0) { throw "Release $env:TAG already exists." }
      - name: Read the release notes
        id: notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $summary = ./scripts/windows/Get-ReleaseNotes.ps1 -Version $env:VERSION -Summary
          ./scripts/windows/Get-ReleaseNotes.ps1 -Version $env:VERSION | Set-Content -LiteralPath build-release-notes.md -Encoding utf8
          "summary=$summary" >> $env:GITHUB_OUTPUT
      - name: Build the setup program
        shell: pwsh
        env:
          SUMMARY: ${{ steps.notes.outputs.summary }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/windows/Build-Installer.ps1 -Configuration Release -UpdateSummary $env:SUMMARY -UsePinnedNsis
          Move-Item -LiteralPath build-release-notes.md -Destination build/release-notes.md
          foreach ($file in "FileMergeAssistant-$env:VERSION-x64-setup.exe", 'file-merge-assistant-update-windows.json') {
            if (-not (Test-Path -LiteralPath "build/$file")) { throw "build/$file was not produced." }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            build/FileMergeAssistant-${{ steps.version.outputs.version }}-x64-setup.exe
            build/FileMergeAssistant-${{ steps.version.outputs.version }}-x64-setup.exe.sha256
            build/FileMergeAssistant-${{ steps.version.outputs.version }}-x64-portable.zip
            build/FileMergeAssistant-${{ steps.version.outputs.version }}-x64-portable.zip.sha256
            build/FileMergeAssistant-${{ steps.version.outputs.version }}-czkawka-*-source.zip
            build/FileMergeAssistant-${{ steps.version.outputs.version }}-czkawka-*-source.zip.sha256
            build/file-merge-assistant-update-windows.json
            build/release-notes.md
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish the prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          CI_URL: ${{ needs.build.outputs.ci_url }}
        run: |
          {
            echo "Preview of File Merge Assistant ${VERSION} for Windows x64, built from ${COMMIT}."
            echo "Validated by [CI](${CI_URL}); SHA-256 files accompany every binary/source archive."
            echo
            cat dist/release-notes.md
            echo
            echo '## Install'
            echo "Download \`FileMergeAssistant-${VERSION}-x64-setup.exe\` and run it. It installs for the current user only and needs no administrator rights."
            echo 'The setup program is unsigned; Windows may show a SmartScreen warning. Verify the published checksum and project source before deciding whether to run it.'
            echo 'This preview omits ImageSharp and the legacy perceptual/video-perceptual CLI algorithms. Native PNG/JPEG review is available.'
            echo 'Native analysis remains experimental. Owner-run filesystem and clean-machine lifecycle acceptance are still pending.'
            echo 'Installed copies check for updates from "Check for updates" in the app.'
          } > "$RUNNER_TEMP/notes.md"
          (cd dist && sha256sum -c ./*.sha256)
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --draft --prerelease \
            --title "File Merge Assistant ${VERSION} (preview)" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/FileMergeAssistant-${VERSION}-x64-setup.exe" \
            "dist/FileMergeAssistant-${VERSION}-x64-setup.exe.sha256" \
            "dist/FileMergeAssistant-${VERSION}-x64-portable.zip" \
            "dist/FileMergeAssistant-${VERSION}-x64-portable.zip.sha256" \
            dist/FileMergeAssistant-${VERSION}-czkawka-*-source.zip \
            dist/FileMergeAssistant-${VERSION}-czkawka-*-source.zip.sha256 \
            dist/file-merge-assistant-update-windows.json
          count="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          test "$count" -eq 7
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
