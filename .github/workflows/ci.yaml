name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows native and full .NET regression
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-windows-${{ hashFiles('native/**/Cargo.lock') }}
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain installation failed.' }
      - name: Rust format, tests, Clippy and .NET integration tests
        shell: pwsh
        run: ./scripts/windows/Build-NativeAnalysis.ps1 -Test

  portable:
    name: Portable analysis (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            library: libfma_czkawka_ffi.so
          - runner: macos-15
            target: aarch64-apple-darwin
            library: libfma_czkawka_ffi.dylib
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.target }}-${{ hashFiles('native/**/Cargo.lock') }}
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build and test the native adapter on the actual target OS
        working-directory: native/fma-czkawka-ffi
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +1.99.1 build --locked --release --target "$TARGET" --target-dir "$RUNNER_TEMP/cargo-target" -j 2
          cargo +1.99.1 test --locked --target "$TARGET" --target-dir "$RUNNER_TEMP/cargo-target" -j 2
      - name: Test the portable .NET contracts with the actual native library
        env:
          TARGET: ${{ matrix.target }}
          LIBRARY: ${{ matrix.library }}
        run: |
          export FMA_NATIVE_LIBRARY_DIR="$RUNNER_TEMP/cargo-target/$TARGET/release"
          test -f "$FMA_NATIVE_LIBRARY_DIR/$LIBRARY"
          dotnet test tests/analysis-tests/Analysis.Tests.csproj --configuration Release --verbosity minimal --logger 'trx;LogFileName=portable.trx' --results-directory "$RUNNER_TEMP/test-results" --blame-hang-timeout 60s --blame-hang-dump-type none
      - name: Preserve portable test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-tests-${{ matrix.target }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 7
