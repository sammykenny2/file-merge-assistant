[package]
name = "fma-czkawka-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "Read-only Czkawka analysis adapter for File Merge Assistant"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
czkawka_core = { git = "https://github.com/qarmin/czkawka", rev = "eb8b91dbb4d25dff416202674ee0de84ee4b5e5c", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "unwind"

[lints.clippy]
all = "warn"
